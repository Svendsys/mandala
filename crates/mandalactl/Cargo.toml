[package]
name = "mandalactl"
version = "0.1.0"
edition = "2021"
license.workspace = true

# A client for the running app's `--ipc` socket (`format/ipc.md`), and
# the sibling of `maptool` rather than a mode of it: `maptool` reads
# `.mindmap.json` files from disk and never talks to a process, this
# talks to a process and never reads a map. The `[lib]` exists for one
# reader beyond the binary — the app crate's tests hold `verbs::VERBS`
# against the registry `describe` renders — and for the integration
# tests, which drive `run` in-process.
#
# No `baumhard` and no logger: nothing here touches a map or a
# degrade path that logs. No `tokio` either; the client is plain
# blocking `std::os::unix::net` I/O, the way the server's boundary
# threads are (CODE_CONVENTIONS §3).

[dependencies]
serde_json.workspace = true
# `record assemble` (`src/assemble.rs`): a recording's PNG frames are
# decoded with `png` and written back as an animated GIF with `gif` —
# both pure Rust, neither needing anything on the host. Video is the
# host's `ffmpeg`, shelled out to and never linked. The app never links
# either encoder; assembly is the client's so the interactive path stays
# lean (`format/ipc.md` §`capture.record_start`).
png.workspace = true
gif = "0.14.2"

# The Windows client for the app's named pipe (`src/client.rs`, #169):
# std can open a named pipe as a file but cannot bound a read or a write
# on it, and the client's every wait is bounded. Used through its
# blocking API only, so the client stays free of an async runtime.
[target.'cfg(windows)'.dependencies]
interprocess.workspace = true

[dev-dependencies]
tempfile.workspace = true
