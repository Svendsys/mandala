# `cargo hakari` settings (#284): the generator behind
# `crates/workspace-hack`, the one crate every workspace member depends
# on so that every cargo command builds each third-party crate with one
# feature set.
#
# Why it exists: cargo resolves features for the packages and targets a
# command selects, so `cargo doc --workspace` (no dev-dependencies) and
# `cargo test -p baumhard` (one member) each settle on a different
# feature set for some shared crate than `cargo test --workspace` does.
# A crate with another feature set is another build of it, and of
# everything that depends on it, beside the first in the same `target/`. The workspace-hack names the union of those feature sets as
# a dependency of every member, so they all agree.
#
# After a change to any member's dependencies, regenerate and commit:
#
#     cargo hakari generate
#     cargo hakari manage-deps
#
# CI's `hakari` job (`.github/workflows/test.yml`) fails when either would
# change a file, so the union cannot drift from the manifests silently.
# Install with `cargo install cargo-hakari --locked`.
#
# Reference: https://docs.rs/cargo-hakari/latest/cargo_hakari/config

hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari
# 0.9.22 or above.
dep-format-version = "4"

# The resolver the workspace uses: the root package is edition 2021,
# which means resolver 2.
resolver = "2"

# The platforms whose feature sets are unified: Linux (every local run
# and the `test` job) and Windows (the `windows-ipc` job, which builds
# two members alone, `-p mandala -p mandalactl`). A platform left out
# still builds; its platform-specific crates are simply not unified.
#
# wasm32 is left out on purpose, and so is the browser build: every
# member depends on the workspace-hack from its `cfg(not(target_arch =
# "wasm32"))` table, for the reasons the root manifest's
# `workspace-hack` entry gives, so nothing compiled for wasm32 depends
# on it. (A browser build still compiles it for the host, under
# `mandala_derive`, which is a proc macro.)
platforms = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Members write `workspace-hack.workspace = true`, and the version lives
# once in the root `[workspace.dependencies]`, as every other dependency
# two members share does (`baumhard::util::manifests`).
workspace-hack-line-style = "workspace-dotted"
