# Runs ./test.sh --lint on every main push and every pull request.
# The script itself owns the test logic (native cargo test + workspace-
# wide wasm32 cargo check, plus the fmt / clippy / doc lint gates);
# this workflow is a transport for invoking it so the dual-target
# discipline in CODE_CONVENTIONS.md §4 and the lint baselines are
# enforced remotely, not just aspirationally locally.
#
# `push: branches: [main]` (rather than bare `push:`) prevents the
# duplicate-run flake: without the constraint, a push to a PR branch
# fires both `push` and `pull_request` events, spawning two identical
# `test` runs at the same SHA that race for runner / cache resources.
# Mirrors `license-headers.yml`'s trigger shape.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: `rust-toolchain.toml` at the repository
      # root names the channel, the clippy and rustfmt components and
      # the wasm32 target, and a bare `rustup toolchain install` reads
      # it. CI and every local run therefore build with the same
      # pinned compiler, and there is no second copy of the version
      # here to drift from the file. That pin is what lets the lint
      # gates below be hard: a new stable release cannot add a lint
      # to this run until the file is bumped.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # The GPU-backed half of the suite (`src/application/app/tests_gpu.rs`,
      # TEST_CONVENTIONS §T8) builds the real app, headless, on whatever
      # adapter the machine has, and otherwise skips with a note. A
      # runner has no GPU; Mesa's lavapipe is a Vulkan ICD that
      # rasterizes on the CPU, and the app runs on it exactly as it
      # does in a GPU-less container (the `mandala-drive` skill's
      # recipe (b)). Installed here so the adapter exists by
      # construction, and `MANDALA_REQUIRE_GPU` below makes a missing
      # one fail the run rather than let the GPU-backed tests pass by
      # skipping — the same arrangement as the wasm32 probe.
      - name: Install Mesa's software Vulkan driver (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      # `lib/baumhard/tests/wasm_font_lock.rs` runs wasm32 code under
      # node and otherwise skips, with a note, when the target or node
      # is absent. Here both are present by construction (the target
      # is installed above; ubuntu-latest ships node), so a missing one
      # means this workflow broke, and the probe must fail rather than
      # pass by skipping. `MANDALA_REQUIRE_GPU` is the same contract
      # for the GPU-backed tests and the adapter installed above.
      #
      # `--lint` adds the fmt, clippy and doc gates (host and wasm32
      # legs). They are hard gates with zero baselines, and without
      # this flag nothing outside a contributor's own machine held
      # them there.
      - name: Run ./test.sh --lint
        env:
          MANDALA_REQUIRE_WASM_PROBE: "1"
          MANDALA_REQUIRE_GPU: "1"
        run: ./test.sh --lint

  # `vendor/cosmic-text` is the published cosmic-text 0.19.0 plus
  # `mandala.patch` (V1-B14, #304; vendor/cosmic-text/PATCHES.md). A path
  # package has no checksum in the lockfile, so nothing else ties the
  # directory to what crates.io published. This job fetches the crate,
  # checks its sha256, applies the patch and compares the result with the
  # directory, then runs cosmic-text's own test suite, which is not
  # vendored, against the patched sources. Its own job, not part of
  # `./test.sh`, because it needs the network and the gate stays offline.
  vendored-cosmic-text:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: vendor/cosmic-text is 0.19.0 plus its patch, and its tests pass
        run: scripts/check_vendored_cosmic_text.sh

  # The workspace-hack (`crates/workspace-hack`, `.config/hakari.toml`,
  # #284) is current. It names, as a dependency of every member, each
  # third-party crate whose feature set would otherwise differ from one
  # cargo command to the next, with the union of those sets; that is
  # what keeps `cargo doc`, `cargo test -p <member>` and the rest from
  # building a second copy of those crates in the same `target/`. It is
  # generated from the members' manifests, so a manifest edit can leave
  # it stale with nothing failing to build — the second copies come
  # back, silently. Hence this job:
  #
  # - `generate --diff` fails when regenerating would change the
  #   workspace-hack's manifest;
  # - `manage-deps --dry-run` fails when a member does not depend on
  #   it (`./test.sh` also checks this one, in
  #   `baumhard::util::manifests`, where cargo-hakari need not be
  #   installed).
  #
  # No build: both read `cargo metadata` and nothing else.
  hakari:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      # Installed into a root of its own and cached by version, as
      # `fuzz.yml` does with cargo-fuzz.
      - name: Cache cargo-hakari
        id: cargo-hakari
        uses: actions/cache@v5
        with:
          path: ~/.cargo-hakari
          key: cargo-hakari-0.9.39-${{ runner.os }}

      - name: Install cargo-hakari
        if: steps.cargo-hakari.outputs.cache-hit != 'true'
        run: cargo install cargo-hakari --version 0.9.39 --locked --root ~/.cargo-hakari

      - name: Put cargo-hakari on the path
        run: echo "$HOME/.cargo-hakari/bin" >> "$GITHUB_PATH"

      - name: The workspace-hack is current
        run: cargo hakari generate --diff

      - name: Every member depends on the workspace-hack
        run: cargo hakari manage-deps --dry-run

  # The Windows named-pipe transport for `--ipc` (#169) and everything
  # above it that compiles there. Its own job because the code it holds
  # is `cfg(windows)`: a Linux run compiles none of it, and the Linux
  # host can type-check it (`cargo check --target x86_64-pc-windows-gnu`)
  # but cannot run it.
  #
  # Deliberately not `./test.sh` on Windows. That script is bash, its
  # wasm32 legs need node and the wasm target, and the rest of the suite
  # has never run on Windows: making all of it pass there is a port of
  # its own, not part of a transport. What this job holds instead:
  #
  # - clippy over the app crate and `mandalactl`, every target,
  #   `-D warnings` — a hard gate as on Linux, and the only lint the
  #   `cfg(windows)` code on either side gets;
  # - the `ipc::` tests: the transport's loopback suite against a real
  #   pipe (and `mandalactl` round-tripping a `ping` over it), the
  #   pipe's own unit tests, and the protocol tests above the
  #   transport;
  # - `mandalactl`'s whole test target (#221): its unit tests, the
  #   loopback scenarios against a fake app on a real pipe, and
  #   `tests/binary.rs` driving the shipped binary over one. Path
  #   expectations are spelled per platform, and the handful of tests
  #   that are Unix-only by nature say why beside their `cfg`.
  #
  # Same triggers as the Linux job, so a pull request cannot merge red on
  # the platform this code is for.
  #
  # `timeout-minutes` is a backstop, not the guard: every wait in the
  # transport and in its tests has a deadline of its own, and a hang is
  # a bug to fix there. It only caps what a regression can cost a run
  # (the default is six hours) — this job takes a few minutes, mostly
  # the build.
  windows-ipc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # `rust-toolchain.toml` pins the same channel the Linux job uses.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Clippy, Windows (hard)
        run: cargo clippy -p mandala -p mandalactl --all-targets -- -D warnings

      # A filter that matches nothing passes with "0 passed", which would
      # turn this job green while testing nothing — a renamed module, a
      # moved test. The step counts what ran and fails on zero.
      - name: The ipc tests, Windows
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p mandala ipc:: 2>&1 | tee ipc-tests.log
          count=$(grep -Eo 'test result: ok\. [0-9]+ passed' ipc-tests.log | awk '{ sum += $4 } END { print sum + 0 }')
          echo "ipc:: tests passed: $count"
          if [ "$count" -eq 0 ]; then
            echo "FAILED: the ipc:: filter selected no tests"
            exit 1
          fi

      # Beyond a zero count, the step checks that the two halves that
      # used to be Unix-only actually ran: a `cfg` that quietly dropped
      # them again would still leave a non-zero count behind.
      # `--no-fail-fast` so a red lib target does not hide what the
      # binary target would have said: one run reports every target.
      - name: The mandalactl tests, Windows
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p mandalactl --no-fail-fast 2>&1 | tee mandalactl-tests.log
          count=$(grep -Eo 'test result: ok\. [0-9]+ passed' mandalactl-tests.log | awk '{ sum += $4 } END { print sum + 0 }')
          echo "mandalactl tests passed: $count"
          if [ "$count" -eq 0 ]; then
            echo "FAILED: mandalactl ran no tests"
            exit 1
          fi
          for ran in 'loopback_tests::test_ping_prints_the_result_fields_and_exits_zero ... ok' \
                     'test_exit_zero_and_a_greppable_line_when_the_app_says_ok ... ok'; do
            if ! grep -qF "$ran" mandalactl-tests.log; then
              echo "FAILED: expected \"$ran\" in the mandalactl run"
              exit 1
            fi
          done
