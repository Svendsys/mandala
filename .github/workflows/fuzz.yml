# Coverage-guided fuzzing of every untrusted-input boundary (design
# D29, V1-B8 #278; TEST_CONVENTIONS §T14). Each job runs one target of
# `fuzz/` through `scripts/fuzz.sh`, the command a contributor runs
# locally, on the nightly `fuzz/rust-toolchain.toml` pins.
#
# Two budgets, one job definition:
#
# - **PR smoke.** A pull request that touches a fuzzed surface (the paths
#   below) or the fuzzing itself runs every target briefly. The target
#   budget is 60 seconds a target. **During V1 it is 300 seconds**: the
#   nightly run below cannot run until V1 is on `main` (see its note),
#   so the smoke is the only fuzzing the V1 branch gets. Drop
#   `SMOKE_SECONDS` to 60 at the switch-over (V1-E5, #257).
# - **Nightly.** A `schedule:` run gives every target 900 seconds,
#   starting from the corpus the last nightly run saved, and saves what
#   it finds back, minimized. GitHub runs scheduled workflows on the
#   default branch only, and `main` is frozen for V1 (D16), so this
#   trigger becomes live when V1 merges (#257). `workflow_dispatch` runs
#   the same job by hand, with a budget of your choice.
#
# Neither is a required check, and neither is part of `./test.sh
# --lint` (which never builds `fuzz/`). A finding fails its job: the
# input is uploaded as an artifact, and the pull request owes a fix and
# a regression test in baumhard before it merges (TEST_CONVENTIONS
# §T14). A corpus is cached, never committed: only `fuzz/seeds/` is.

name: fuzz

on:
  pull_request:
    # Everything a target's build reads: all of baumhard's source (a
    # surface's code calls into modules no narrower list keeps up with),
    # its build script (the fonts shaping reads), the manifests and
    # lockfiles that pick its dependencies, the fuzzing itself, and the
    # repository's maps, which the loader targets read as seeds.
    paths:
      - "lib/baumhard/src/**"
      - "lib/baumhard/build.rs"
      - "lib/baumhard/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "fuzz/**"
      - "scripts/fuzz.sh"
      - ".github/workflows/fuzz.yml"
      - "maps/*.mandala.json"
  schedule:
    # Nightly, at an off-peak minute.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: true
        default: "900"

env:
  SMOKE_SECONDS: "300"
  NIGHTLY_SECONDS: "900"

# The jobs read the repository and write only caches and artifacts.
permissions:
  contents: read

# A new push to a pull request cancels that pull request's runs still
# going; a nightly or dispatched run is never cancelled.
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The budget, plus the build (about ten minutes cold) and the corpus
    # minimization; a backstop against a hang the per-input timeout
    # misses, not the guard.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - load_raw
          - load_structured
          - flow_raw
          - flow_structured
          - glyph_mutation_raw
          - glyph_mutation_structured
    steps:
      - uses: actions/checkout@v7

      - name: Choose the budget
        id: budget
        # Every value reaches the shell through `env:`, never spliced
        # into the script: a dispatched budget is free text, and is
        # refused unless it is a positive whole number.
        env:
          EVENT: ${{ github.event_name }}
          DISPATCHED: ${{ github.event.inputs.seconds }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$EVENT" in
            pull_request) seconds="$SMOKE_SECONDS" ;;
            schedule) seconds="$NIGHTLY_SECONDS" ;;
            *) seconds="${DISPATCHED:-$NIGHTLY_SECONDS}" ;;
          esac
          if ! [[ "$seconds" =~ ^[1-9][0-9]*$ ]]; then
            echo "The budget must be a positive whole number of seconds." >&2
            exit 1
          fi
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "Fuzzing $TARGET for $seconds seconds ($EVENT)."

      # No toolchain action: `fuzz/rust-toolchain.toml` names the nightly,
      # and a bare `rustup toolchain install` in that directory reads it.
      - name: Install the pinned nightly
        working-directory: fuzz
        run: |
          rustup toolchain install
          rustup show

      # Installed into a root of its own, not ~/.cargo/bin: the build
      # cache below cleans ~/.cargo/bin of every binary it did not
      # restore before this cache's post step saves it, which left the
      # first validation run with nothing to save.
      - name: Cache cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache@v5
        with:
          path: ~/.cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked --root ~/.cargo-fuzz

      - name: Put cargo-fuzz on the path
        run: echo "$HOME/.cargo-fuzz/bin" >> "$GITHUB_PATH"

      # One build cache for every target: their dependencies, baumhard
      # among them, are built alike, so one entry saves it and all six
      # restore it. The saving entry builds every target first, so the
      # cache holds each one's binary too.
      - name: Cache the fuzz build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz
          save-if: ${{ matrix.target == 'load_raw' }}

      - name: Build every target (the entry that saves the build cache)
        if: matrix.target == 'load_raw'
        working-directory: fuzz
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo fuzz build

      # Every run starts from the newest corpus a nightly run saved for
      # this target; a pull request reads it and never writes it.
      - name: Restore the corpus
        uses: actions/cache/restore@v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          BUDGET: ${{ steps.budget.outputs.seconds }}
        run: scripts/fuzz.sh "$TARGET" "$BUDGET"

      - name: Upload the finding
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-finding-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      # Kept small: minimized to the inputs that still add coverage.
      - name: Minimize the corpus
        if: success() && github.event_name != 'pull_request'
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: cargo fuzz cmin "$TARGET" "corpus/$TARGET"

      - name: Save the corpus
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
