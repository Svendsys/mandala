<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandala</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #141414; }
        /*
          `touch-action: none` is a prerequisite for the touch
          vocabulary, not a style. Without it the user agent claims
          a touch sequence for its own panning and pinch-zooming
          before the app ever sees it: the browser fires
          `pointercancel` and winit stops delivering
          `WindowEvent::Touch`, so a one-finger pan scrolls the page
          and a pinch zooms the document instead of the canvas.
          Nothing else supplies it — neither this repo nor winit
          0.30's web backend sets `touch-action` anywhere, and
          winit's `preventDefault()` on pointer events does not
          govern the behaviors `touch-action` governs.

          `none` rather than `manipulation` or `pan-*`: those hand
          part of the gesture back to the user agent, and this
          canvas implements every one of them itself
          (`app/touch_gesture.rs`). Nothing is lost — the page has
          `overflow: hidden` and the canvas fills the viewport, so
          there is nothing to scroll and no chrome underneath.

          Deliberately NOT paired with `user-scalable=no` in the
          viewport meta: modern Safari and Chrome ignore it as an
          accessibility measure, so writing it would claim a
          guarantee the platform does not honor, and where it is
          honored it takes pinch-to-magnify away from users who
          need it. iOS Safari is also the known gap for this rule —
          it honors `touch-action` for scrolling but has
          historically kept page pinch-zoom on regardless — which is
          a browser fact this file cannot fix and #158 owns
          confirming.

          `test_the_browser_canvas_keeps_touch_gestures_from_the_user_agent`
          holds this declaration.
        */
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
</head>
<body>
    <link data-trunk rel="rust" href="../Cargo.toml" data-wasm-opt="z" />
    <!--
      The four loadable fixtures, named one by one rather than
      `copy-dir ../maps`. The directory also holds
      `testament.mind` — a 1 MB 7z miMind archive kept for the
      `maptool convert --legacy` reference — and `docs/`, neither
      of which any browser code can open, so `copy-dir` put a
      megabyte of unreachable bytes in every bundle a phone
      downloads (CODE_CONVENTIONS §4).

      `data-target-path="maps"` reproduces the `dist/maps/` layout
      `copy-dir` produced, which is what `?map=` and
      `DEFAULT_MINDMAP` resolve against.

      A new fixture has to be added here too:
      `test_every_shipped_map_reaches_the_browser_bundle` reads
      this file against `maps/` and fails naming the one that is
      missing.
    -->
    <link data-trunk rel="copy-file" href="../maps/testament.mindmap.json" data-target-path="maps" />
    <link data-trunk rel="copy-file" href="../maps/theme_demo.mindmap.json" data-target-path="maps" />
    <link data-trunk rel="copy-file" href="../maps/palette_cascade.mindmap.json" data-target-path="maps" />
    <link data-trunk rel="copy-file" href="../maps/stress_long_edges.mindmap.json" data-target-path="maps" />
</body>
</html>
