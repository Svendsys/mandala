[package]
name = "baumhard"
version = "0.1.0"
edition = "2021"
license.workspace = true
# The `[[bench]]` entry at the bottom of this file is the crate's only
# benchmark target, and this is what makes "only" true. Cargo's
# default is to *also* auto-discover every other `.rs` under
# `benches/` as a bench target compiled against the libtest harness —
# which ignores `criterion_main!`, so such a file builds, links
# criterion, runs zero benchmarks and reports success. A `_template.rs`
# sat there doing exactly that. Turning autodiscovery off means a new
# bench has to be declared with `harness = false` to exist at all.
autobenches = false
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.10.3"
serde.workspace = true
# `raw_value` is what lets `document::format`'s loader index a map
# before it builds one (`format/index.rs`): every top-level value and
# every node is captured as a `&RawValue` borrowed from the text, with
# no copy and no tree built, and then parsed on its own. That keeps the
# order of keys in a file insignificant, gives every node an exact
# place in the text, and starts the reader's nesting count at each node
# rather than at the top of the file (design B.7, B.14).
serde_json = { workspace = true, features = ["raw_value"] }
slab = "0.4.12"
lazy_static = "1.5.1"
# `release_max_level_warn` is what keeps baumhard's §9 degrade paths
# (unknown font id, UTF-8 conversion failure, corrupt-region drop)
# diagnosable from a user report while the chatty walker
# `debug!`/`trace!` instrumentation still compiles to nothing. It is
# declared once, in the root `[workspace.dependencies]` table — there
# is no longer a second manifest for this one to fall out of lockstep
# with.
log.workspace = true
glam.workspace = true
cosmic-text = "0.19.0"
# The lock behind `font::fonts::FONT_SYSTEM`. Chosen over
# `std::sync::RwLock` for one capability std lacks: a *timed* write
# acquire that queues fairly (`try_write_for`) instead of a
# `try_write` + sleep poll, which is unfair and starved a waiter past
# its ceiling under parallel tests. 0.13 rather than the 0.12 wgpu 30
# and arboard ask for, so it is a second copy beside theirs: 0.13 is
# the release with `RecursiveRwLock`, which `FONT_SYSTEM` is
# (`util::lock_duplicates` lists the pair with that reason, #284). On
# `wasm32-unknown-unknown` without
# atomics its parker panics, so a *contended* acquire traps there;
# `fonts.rs` catches every same-thread cause of contention first, and
# the browser has no second thread to cause another. The uncontended
# path never parks and never reads a clock, which is the only path
# the browser takes — `tests/wasm_font_lock.rs` runs that claim.
parking_lot = "0.13.0"
tinyvec = "1.13.3"
# The document writer's index of incoming links
# (`document::writer::upkeep`): one inline slot pair per linked-to node,
# since most nodes are the target of one or two links. `tinyvec` cannot
# hold a `NodeId`, which has no `Default`. Already in the lockfile, at
# this version, through cosmic-text and parking_lot.
smallvec = "1.16.3"
unicode-segmentation = "1.13.3"
# The type `cosmic_text::Fallback::script_fallback` takes, which
# cosmic-text does not re-export: `font::fallback` implements the trait
# to put the compiled ornament faces first (#297). Already in the
# lockfile, at this version, through cosmic-text.
unicode-script = "0.5.8"
rustc-hash.workspace = true
strum.workspace = true
strum_macros.workspace = true
ordered-float = {version = "5.5.0", features = ["serde"]}
# The loader's unknown-key capture. serde reports a key no field
# matches by handing its value to `deserialize_ignored_any`, and
# nothing in `serde` itself says *where* that happened; this wraps a
# deserializer to answer that. `mindmap::unknown_keys` is the only
# consumer, and the only crate member that loads `.mandala.json` is
# this one — so it stays out of `[workspace.dependencies]` per §13.
serde_ignored = "0.1.14"
# Where a `.mandala.json` load went wrong. serde reports *what* was
# wrong with a value and nothing about *where* in the file it sat;
# `document::format::load` wraps its deserializer in this to answer
# that, so every strict-loader error names its JSON path
# (`nodes[3].frame.rings[0].spans[2].color`). `document::format` is the
# only consumer, so it stays out of `[workspace.dependencies]` per §13.
serde_path_to_error = "0.1.20"

# `env_logger` is load-bearing, not a leftover — and it is the native
# half of a matched pair with `console_log` below. `util::log::init()`
# is the workspace's single logger-installation point, and the binaries
# that front this library call it: the app crate's `main`, `maptool`,
# and `src/bin/generate_stress_map.rs`, which this crate ships itself.
# Since `log`'s `release_max_level_warn` above keeps `warn!`/`error!`
# alive in release builds, a release run with no logger installed would
# silently drop exactly the diagnostics CODE_CONVENTIONS §9's "log and
# degrade" posture depends on.
#
# Declared per-target rather than feature-gated. A feature both
# consumers would always enable is a switch with one position; the
# real axis is the target, because `init()`'s two arms are already
# `cfg(target_arch)`-split and `env_logger` has nothing to do on
# wasm32. Placing it here says that in the manifest and stops the
# browser build compiling it.
#
# One consequence worth writing down, because it is invisible in this
# diff and the error it would eventually produce points somewhere
# else: `env_logger` was the only crate enabling `log/std` on the
# wasm32 leg, and cargo unions features per target, so the browser
# build's `log` is now `release_max_level_warn` alone where it used to
# be `release_max_level_warn,std`. That is survivable because the
# wasm arm of `init()` installs its own `static` capturing wrapper
# through `log::set_logger(&WASM_LOGGER)` — the same shape `console_log
# 1.1.0`'s `init_with_level` takes (`console_log-1.1.0/src/lib.rs:222`)
# — and forwards each record to `console_log::log`; neither reaches for
# `log::set_boxed_logger`, which is the API `log`'s `std`/`alloc`
# features gate. A wasm arm that did, or a replacement for `console_log`
# that boxes its logger, needs `log = { workspace = true, features =
# ["std"] }` here — without it the browser build stops compiling with
# an error naming `log`, not this line.
#
# The asymmetry with `rand` is deliberate and is not an oversight: see
# the `getrandom` note in the root manifest. `rand` cannot move into a
# `cfg(not(wasm32))` table the way `env_logger` did, because
# `generate_stress_map` uses it and the wasm32 gate builds that binary
# on both legs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"
# One feature set for every shared dependency, whatever a native
# command selects (`.config/hakari.toml`, #284). Native only, as in
# every member: the root manifest's `workspace-hack` entry says why.
workspace-hack.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = "1.1.0"
console_error_panic_hook = "0.1.7"

[build-dependencies]
walkdir = "2.5.0"
path-slash = "0.2.1"
ttf-parser = "0.25.1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
# `util::serde_coverage` parses baumhard's own sources so the
# unknown-key policy is checked against the model that exists rather
# than a list of the model as it once was. `full` is what adds the
# item / expression parsers `syn::parse_file` needs; keeping the
# dependency test-only means a shipped build never links it.
#
# `features` on a workspace dependency is additive, so this asks for
# `full` on top of the default set the root table declares, without
# editing the shared entry. What is compiled is another matter: the
# workspace-hack (`.config/hakari.toml`, #284) carries `full` and
# `visit` to every native build of syn 3, the proc-macro graph's
# included, so that one build serves both — see `lib/mandala_derive/Cargo.toml`.
# This entry is still where the ask is made, and what `cargo hakari
# generate` reads it from.
# `visit` is for `util::source_scan::section_growths_in`, which walks
# fn bodies as syntax rather than as lines, so a rustfmt-wrapped
# `node.sections\n    .push(` chain is the same growth as the one-line
# spelling (#208). Test-only, like the rest of this entry.
syn = { workspace = true, features = ["full", "visit"] }
# `util::source_scan` excises `#[cfg(test)]` items from a file's text
# and has to leave the surviving lines *at their own line numbers*, so
# a guard reporting an offender can say `file:line`. That needs the
# span of the item syn parsed, and a span carries a line only when
# proc-macro2 was built with `span-locations` — without it every
# `Span::start()` answers line 0 and the excision would blank the
# wrong rows in silence.
#
# Additive on the shared entry, like `syn`'s `full` above, and carried
# to every native build of proc-macro2 by the workspace-hack for the same
# reason: the derive macros the workspace expands compile against the
# same proc-macro2 build as these tests.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# The allocator `tests/format_memory.rs` measures a load's peak heap
# with: it wraps the system allocator and counts, so the test can derive
# wasm32's `MAX_MAP_BYTES` from how far a map's text expands into its
# document, and fail when that grows. A counting allocator needs a
# `GlobalAlloc` impl, which is `unsafe`; baumhard's own source holds none
# (CONVENTIONS.md), so it comes from here. Test-only: no shipped build
# links it.
cap = { version = "0.1.2", features = ["stats"] }

[[bench]]
name = "test_bench"
harness = false
