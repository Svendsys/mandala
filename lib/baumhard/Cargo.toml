[package]
name = "baumhard"
version = "0.1.0"
edition = "2021"
license.workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.10.1"
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
slab = "0.4.12"
lazy_static = "1.5.0"
log = { version = "0.4.29", features = ["release_max_level_off"] }
env_logger = "0.11.10"
smol_str = "0.3.6"
indextree = {version = "4.8.1", features = ["serde"]}
glam = {version = "0.32.1", features = ["serde"]}
cosmic-text = "0.18.2"
tinyvec = "1.11.0"
unicode-segmentation = "1.13.2"
rustc-hash = "2.1.2"
strum = "0.28.0"
strum_macros = "0.28.0"
enumset = {version = "1.1.10", features = ["serde"]}
ordered-float = {version = "5.3.0", features = ["serde"]}
derivative = "2.2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = "1.0.0"
console_error_panic_hook = "0.1.7"

[build-dependencies]
walkdir = "2.5.0"
path-slash = "0.2.1"
ttf-parser = "0.25.1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
# `util::serde_coverage` parses baumhard's own sources so the
# unknown-key policy is checked against the model that exists rather
# than a list of the model as it once was. `full` is what adds the
# item / expression parsers `syn::parse_file` needs; keeping the
# dependency test-only means a shipped build never links it.
syn = { version = "2.0.117", features = ["full"] }

[[bench]]
name = "test_bench"
harness = false
