[package]
name = "guarded_file"
version = "0.1.0"
edition = "2021"
license.workspace = true

# The workspace's one writer of a file at a path someone else named
# (`src/lib.rs`): the app's, `maptool`'s and `mandalactl`'s. A crate of
# its own rather than a module of baumhard only because `mandalactl`
# takes no baumhard dependency (its manifest says why) and the writer is
# owed to it too (#357, ruling B38.1). baumhard re-exports it as
# `baumhard::util::guarded_file`, so the app and `maptool` reach it
# where they always did.
#
# std only. The exclusive create that keeps a write from following a
# symlink is `create_new`, which on Unix is `O_CREAT|O_EXCL` (never
# follows a link at the final component, POSIX) and on Windows
# `CREATE_NEW` with `FILE_FLAG_OPEN_REPARSE_POINT` (opens a link as
# itself); the crate's docs and tests hold both.

# One feature set for every shared dependency, whatever a native
# command selects (`.config/hakari.toml`, #284). Native only, as in
# every member: the root manifest's `workspace-hack` entry says why.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
workspace-hack.workspace = true
