[package]
name = "mandala_derive"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
# Inherited featureless, because the default set (`derive`, `parsing`,
# `printing`, `clone-impls`, `proc-macro`) is all this macro asks for:
# it never reaches into syn's expression / statement / item parsers,
# which is what `["full"]` adds.
#
# Asking for less is not the same as compiling against less, and it is
# worth being exact about that here rather than believing the
# comfortable version. This crate depends on the workspace-hack
# (`.config/hakari.toml`, #284), as every member does, and through it
# on `syn` with the union of every feature any member asks for —
# baumhard's `full` and `visit` among them — on the proc-macro graph as
# well as the target one. So what it compiles against is that union,
# in every build, `cargo build -p mandala_derive` included; that is
# what lets one build of syn serve every command.
#
# What inheriting featureless does buy is the structural half: a
# member can add `features` on top of the shared entry without editing
# the shared entry, which is how baumhard's dev-dependency asks for
# `full` (see `lib/baumhard/Cargo.toml`), and the ask stays where it is
# used, for `cargo hakari generate` to read.
syn.workspace = true
quote = "1.0.47"
# Hoisted to `[workspace.dependencies]` when baumhard's tests grew a
# second declaration of it (§13). Nothing here needs `span-locations`
# — that ask is baumhard's — though this crate compiles against it all
# the same, through the workspace-hack, like `syn`'s `full` above.
proc-macro2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# One feature set for every shared dependency, whatever a native
# command selects (`.config/hakari.toml`, #284). Native only, as in
# every member: the root manifest's `workspace-hack` entry says why. A
# proc macro is compiled for the host, so for this crate the table
# applies in every build, the browser's included; it is spelled as in
# the other members so that one rule covers all of them.
workspace-hack.workspace = true
