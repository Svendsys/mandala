[package]
name = "mandala_derive"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
# Inherited featureless, because the default set (`derive`, `parsing`,
# `printing`, `clone-impls`, `proc-macro`) is all this macro asks for:
# it never reaches into syn's expression / statement / item parsers,
# which is what `["full"]` adds.
#
# Asking for less is not the same as compiling against less, and it is
# worth being exact about that here rather than believing the
# comfortable version. In any native build of another member, this
# crate compiles against the `syn` the workspace-hack
# (`.config/hakari.toml`, #284) unifies: the union of every feature any
# member asks for, baumhard's `full` and `visit` among them, on the
# proc-macro graph as on the target one, so one build of it serves both.
# Only a build of this crate alone (`cargo test -p mandala_derive`)
# compiles it against the defaults.
#
# This crate is the one member that does not depend on the
# workspace-hack itself (`[final-excludes]` in `.config/hakari.toml`).
# A proc macro is compiled for the host in every build, the browser's
# included, so a dependency here would put the union into the
# browser build's host graph: every crate in it built a second time,
# for the host, by each wasm32 command.
#
# What inheriting featureless does buy is the structural half: a
# member can add `features` on top of the shared entry without editing
# the shared entry, which is how baumhard's dev-dependency asks for
# `full` (see `lib/baumhard/Cargo.toml`), and the ask stays where it is
# used, for `cargo hakari generate` to read.
syn.workspace = true
quote = "1.0.47"
# Hoisted to `[workspace.dependencies]` when baumhard's tests grew a
# second declaration of it (§13). Nothing here needs `span-locations`
# — that ask is baumhard's — though this crate compiles against it all
# the same in a native build of the workspace, like `syn`'s `full`
# above.
proc-macro2.workspace = true
