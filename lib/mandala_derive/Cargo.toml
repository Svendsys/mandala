[package]
name = "mandala_derive"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
# Inherited featureless, because the default set (`derive`, `parsing`,
# `printing`, `clone-impls`, `proc-macro`) is all this macro asks for:
# it never reaches into syn's expression / statement / item parsers,
# which is what `["full"]` adds.
#
# Asking for less is not the same as compiling against less, and it is
# worth being exact about that here rather than believing the
# comfortable version. Cargo unifies features per *resolved package
# node*, not per declaring manifest, so what this crate compiles
# against is the union of what every dependent of that node asked for.
# In a workspace-wide build — which is what `./test.sh` now runs —
# `syn`'s proc-macro-graph node carries
# `full,extra-traits,visit,...`, put there by `strum_macros`,
# `wasm-bindgen-backend` and friends, and mandala_derive gets that
# node. `cargo tree -p mandala_derive` in isolation shows default-only,
# but that is single-package resolution, not a build anyone runs.
#
# What inheriting featureless does buy is the structural half: a
# member can add `features` on top of the shared entry without editing
# the shared entry, which is how baumhard's dev-dependency asks for
# `full` (see `lib/baumhard/Cargo.toml`). Under resolver 2 that
# dev-dependency lands on the *target*-graph `syn` node, a different
# node from the proc-macro one above — which is the only sense in
# which the two asks are independent.
syn.workspace = true
quote = "1.0.41"
# Hoisted to `[workspace.dependencies]` when baumhard's tests grew a
# second declaration of it (§13). Nothing here needs `span-locations`
# — that ask is baumhard's and, under resolver 2, lands on a
# different `proc-macro2` node than the one this crate compiles
# against.
proc-macro2.workspace = true
