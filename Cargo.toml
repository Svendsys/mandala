[workspace]
members = ["lib/baumhard", "lib/mandala_derive", "lib/glyphon", "crates/maptool", "crates/mandalactl"]

[workspace.package]
license = "MPL-2.0"

# Single source of truth for the version of every dependency more than
# one workspace member needs. The rule, which
# `baumhard::util::manifests::tests` enforces rather than merely
# stating:
#
#   a dependency belongs in this table exactly when two or more
#   members depend on it, and when it is here no member may name a
#   version of it — they write `dep.workspace = true`.
#
# Both halves matter. Without the first, two manifests can name the
# same crate at different versions and cargo will happily build both;
# that is not hypothetical, it is what happened to `strum` (0.27 in
# the app crate, 0.28 in baumhard), costing two copies of the runtime
# crate and two proc-macro compilations until #106 unified them by
# hand. Without the second, hoisting is decorative: a member that
# still writes `strum = "0.27"` silently wins over the workspace
# entry. And a dependency only one member uses is *not* listed here —
# separating a version from its single use site buys nothing and
# costs a lookup.
#
# Per-member feature differences survive: `features` in a member
# manifest is additive on top of whatever this table declares, and a
# member can therefore ask for more without editing this table. The
# live example is `syn`, listed here without features — baumhard's
# dev-dependency adds `["full"]` for `util::serde_coverage`'s
# `parse_file`, while `mandala_derive` asks for nothing beyond the
# defaults its macro needs.
#
# "Asks for" and "compiles against" are not the same thing, and this
# comment used to conflate them. Cargo unifies features per resolved
# package node, so what any member compiles against is the union over
# that node's dependents; `mandala_derive` in a workspace-wide build
# gets the proc-macro graph's `syn`, `full` and all. See the note in
# `lib/mandala_derive/Cargo.toml` for the detail. Listing a dependency
# featureless here is about where the *declaration* lives, not about
# what gets compiled.
[workspace.dependencies]
# Declared once because two manifests read it: the root turns its
# `wasm_js` feature on for the browser build (see the wasm32 table
# below), and `mandalactl` calls it for the relay's token
# (`crates/mandalactl/src/bridge/mod.rs`).
getrandom = "0.4.3"
glam = { version = "0.34.1", features = ["serde"] }
indextree = { version = "4.9.2", features = ["serde"] }
# Two members name it, both only on Windows: the app's `--ipc` named-pipe
# server (`src/application/ipc/transport/pipe.rs`) and `mandalactl`'s
# client for it (`crates/mandalactl/src/client.rs`). Neither crate has
# `unsafe`, and std has no named-pipe server and no pipe security
# descriptor; this crate supplies both, for the server's first instance
# and for `mandalactl`'s client. (The server's write timeouts and
# disconnects are tokio's — see the `cfg(windows)` dependencies below.)
# Pinned exactly (`=`) because what the server relies on was verified
# in this version's source, not inferred from its docs: the first
# instance is created with `FILE_FLAG_FIRST_PIPE_INSTANCE` and
# `PIPE_REJECT_REMOTE_CLIENTS`, and the security descriptor comes from
# an SDDL string with no `unsafe` on our side
# (`listener/create_instance.rs`, `security_descriptor/owned.rs`). A
# bump re-verifies those three.
interprocess = "=2.4.7"
# `release_max_level_warn`: `warn!`/`error!` survive into release
# builds so CODE_CONVENTIONS §9's "log and degrade" posture is real in
# the binaries users run; `info!`/`debug!`/`trace!` still compile to
# nothing so hot paths keep their zero-cost posture.
#
# This one line replaces a rule that used to be enforced by luck and a
# comment. The app crate and baumhard each declared the feature
# separately, and the reason a mismatch was survivable is that cargo
# unions log's features across the workspace and log
# `compile_error!`s on "multiple release_max_level_* features set"
# (`log-0.4.34/src/lib.rs:381-399`) — a mixed workspace failed to
# build rather than resolving to something. Worth knowing what that
# saved us from: `STATIC_MAX_LEVEL` (`lib.rs:1646`) matches its arms
# in declaration order, `off` first, so absent the guard a mixed
# `off`/`warn` set would have silently resolved to `Off` and deleted
# the channel. There is now nothing to mix — the feature is declared
# once. What still has no compiler behind it is *this* declaration
# drifting to the wrong level (back to `off`, or dropped entirely,
# which uncaps release to `Trace`); `baumhard::util::log::tests` pins
# that, and separately pins the `log` version the `compile_error!`
# above was read in, so a bump has to re-verify the citation rather
# than inherit it.
#
# `kv`: lets a log site attach a stable diagnostic code beside its
# message (`log::warn!(code = SOME_CODE; "area: …")`). Nothing is
# printed differently: env_logger's own `kv` feature stays off. The
# reader is `baumhard::util::log::capture`, which hands the code to the
# IPC reply's `warnings` array (`format/ipc.md` §Warnings).
log = { version = "0.4.34", features = ["release_max_level_warn", "kv"] }
# Two members name it, so it lives here: `mandala_derive` writes a
# proc macro with it, and baumhard's dev-dependency asks for
# `span-locations` on top (see `lib/baumhard/Cargo.toml`).
#
# Featureless here for the same reason `syn` is. `span-locations`
# makes proc-macro2 record a line and column for every token it
# parses, which is not free — and under resolver 2 the ask lands on
# the *target*-graph node baumhard's tests compile against, not the
# proc-macro-graph node every derive in the workspace goes through.
# Putting the feature in this table would move that cost onto every
# derive macro expansion for the benefit of one test-only reader.
proc-macro2 = "1.0.107"
rustc-hash = "2.1.3"
# Spike (c): the vendored glyphon and the app both build against wgpu;
# baumhard and the vendored glyphon both against cosmic-text.
wgpu = "30.0.1"
cosmic-text = "0.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Two members name it: the app's screenshot encoder
# (`src/application/capture/png.rs`) and `mandalactl`'s `record
# assemble`, which decodes a recording's frames. Native on the app side,
# every target on this one's (the workspace is type-checked for wasm32).
png = "0.18.1"
strum = "0.28.0"
strum_macros = "0.28.0"
# Two members name it, both as a dev-dependency: `maptool`'s file tests
# and `mandalactl`'s loopback tests need a scratch directory that
# deletes itself.
tempfile = "3.27.0"
# Deliberately featureless here; see the `features` note above. `syn`
# is one of the heaviest compile dependencies in the graph, so the
# default-feature set is the one to inherit and `["full"]` the one to
# ask for.
syn = "3.0.9"

# The profile `./build.sh --fat` selects, and the reason that flag
# exists: `release` keeps `codegen-units = 16` and thin-local LTO so
# incremental release builds stay tolerable during development, which
# leaves cross-crate inlining on the table. `release-lto` trades build
# time for that — one codegen unit per crate and whole-graph LTO — and
# is what a shipped native binary should be built with. It is a
# separate profile rather than a change to `release` so the everyday
# `cargo build --release` loop is not taxed.
#
# Kept in the root manifest because cargo only honors `[profile.*]`
# there: a `[profile.release-lto]` in `lib/baumhard/Cargo.toml` is
# ignored with a warning, so this is the one place it can live.
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[package]
name = "mandala"
version = "0.1.0"
edition = "2021"
license.workspace = true
# TEST_CONVENTIONS §T2.3 as a manifest fact rather than a sentence:
# this crate has no benchmark harness. Without this, cargo
# auto-discovers anything dropped into `benches/` as a bench target
# built against the *default* libtest harness, which ignores
# `criterion_main!` and yields a binary that runs zero benchmarks
# while looking like it runs some. That is what used to be here.
autobenches = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rustc-hash.workspace = true
# NOTE: `unicode-segmentation` is deliberately NOT a dependency of the
# app crate. Every grapheme primitive lives in
# `baumhard::util::grapheme_chad` (lib/baumhard/CONVENTIONS.md §B3);
# leaving the crate out makes that containment compiler-enforced
# rather than a review convention.
# NOTE: `cosmic-text` is deliberately NOT a dependency of the app
# crate either. `lib/baumhard/CONVENTIONS.md` §B5 concentrates every
# cosmic-text touch in `lib/baumhard/src/font/`, which re-exports the
# handful of types the renderer needs (`baumhard::font::Buffer`,
# `::Color`, `::FontSystem`, ...). Leaving the crate out of this
# manifest makes that containment compiler-enforced: a `use
# cosmic_text::...` in `src/` no longer resolves.
wgpu = { workspace = true, features = ["webgl"] }
# `derive`: the positioned-glyph pass's instance and uniform structs
# (`renderer::glyph_runs`) are `Pod` by derive, with no `unsafe`.
bytemuck = { version = "1.25.2", features = ["derive"] }
# Spike (c): glyphon 0.12.0, vendored (`lib/glyphon`, MIT OR Apache-2.0
# OR Zlib) with a positioned-glyph prepare added.
glyphon = { path = "./lib/glyphon" }
# Alternative: https://crates.io/crates/ab_glyph
glam.workspace = true
# `serde`: the IPC `input.key` command spells a named key the way
# winit's own `NamedKey` deserializes ("Enter", "ArrowLeft"). Those are
# the names `keybinds::key_to_name` reads off a live event; a keybind
# compares them lowercased, while the wire takes winit's casing, so a
# binding's key is pressed by its name with winit's capitals.
winit = { version = "0.30.13", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
# `release_max_level_warn` and the reasoning behind it now live once,
# in `[workspace.dependencies]` above.
log.workspace = true
strum.workspace = true
strum_macros.workspace = true
indextree.workspace = true
baumhard = {path="./lib/baumhard"}
mandala_derive = {path="./lib/mandala_derive"}
# Cross-platform `Instant` — on native re-exports `std::time::Instant`;
# on wasm32 uses `performance.now()`. Needed because
# `std::time::Instant::now()` panics on `wasm32-unknown-unknown`
# ("time not implemented on this platform").
web-time = "1.1.0"

# NOTE: no `[build-dependencies]` here on purpose — this crate has no
# `build.rs`. The font-manifest generator that needs
# walkdir/path-slash/ttf-parser is `lib/baumhard/build.rs`, and it
# declares them itself. Cargo still resolves a `[build-dependencies]`
# table on a crate with no build script — it lands in `Cargo.lock` and
# participates in version unification — while nothing ever compiles
# against it, so the block that used to sit here was pure carrying
# cost. If a build script is ever added, declare its deps then.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
arboard = "3.7.0"
# The screenshot engine's encoder (`src/application/capture/png.rs`).
# Native-only with the engine: the readback blocks on a buffer map,
# which a browser cannot. `arboard` already brings this exact version
# into the native graph through `image`, so naming it adds no crate.
# Declared once, in `[workspace.dependencies]`, since `mandalactl` reads
# the same format.
png.workspace = true

# The `--ipc` socket's lifecycle needs one POSIX call std does not
# expose — `geteuid`, so the directories on the socket's path are only
# trusted when this user or root owns them, and a stale socket is only
# ever replaced when it is ours — and this crate has no `unsafe`.
# `cfg(unix)` rather than the native table because Windows has no such
# call and no Unix-socket transport. rustix 1.x already reaches the
# native graph through the windowing stack, so the table adds a feature
# to that copy rather than a second version of the crate.
#
# `fs` is for `query.document`'s `to_file` (`ipc/commands/query.rs`):
# its temp file has to be created exclusively *and* with `O_NOFOLLOW`,
# so the kernel, not a check beforehand, refuses a symlink. std has no
# spelling for that flag without `unsafe` or a `libc` dependency; this
# crate has no `unsafe`, and rustix is already here.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process", "fs"] }

# The `--ipc` named-pipe transport (`src/application/ipc/transport/pipe.rs`,
# #169). `interprocess` creates the pipe — its first instance, with the
# owner-only security descriptor. Every later instance, and every
# connection, is a `tokio` named-pipe server: the only safe API in the
# graph that can time a pipe write out and disconnect a client stalled
# on one (`NamedPipeServer::disconnect`), which a blocking pipe write
# offers no way to do. `tokio` runs on one worker for the pipe I/O, with
# each boundary thread blocking on one call at a time, the shape
# `work_plans/LLM_IPC.md` §D2 asks for. `widestring` spells the SDDL
# string the way `SecurityDescriptor::deserialize` takes it.
# Windows-only, so neither the Unix nor the wasm32 graph changes.
[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
widestring = "1.2.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
# `WebSocket`, `MessageEvent` and `CloseEvent` are the browser IPC
# transport's (`src/application/ipc/browser/socket.rs`).
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Storage", "Location", "Performance", "EventTarget", "KeyboardEvent", "Response", "WebSocket", "MessageEvent", "CloseEvent"] }
# Load-bearing despite having no call site anywhere in `src/`, which
# is exactly why it is worth a comment: this entry exists to turn a
# *feature* on, and the next dead-dependency sweep will otherwise find
# it and delete it. `getrandom` reaches the graph through
# `baumhard`'s `rand`, and on `wasm32-unknown-unknown` it has no
# default backend — without `wasm_js` it fails to compile its own
# `backends` module (`cannot find function 'inner_u32' in module
# 'backends'`, reproduced by removing this line and running the
# `./test.sh` wasm32 gate). Cargo unions features across the
# workspace, so declaring it in the crate that *is* the wasm binary
# is what makes the browser build resolve. The version is the
# workspace table's; the feature is this manifest's.
getrandom = { workspace = true, features = ["wasm_js"] }

# No `criterion` here, and no `[dev-dependencies]` for a benchmark
# harness: this crate has no benchmark harness (TEST_CONVENTIONS §T2.3)
# and every mandala-side test lives inline. `benches/` used to hold a
# `_template.rs` that cargo auto-discovered under the *default*
# libtest harness — which ignores `criterion_main!` — so it linked
# criterion into the build and then ran zero benchmarks. The
# benchmark harness is baumhard's; see
# `lib/baumhard/benches/test_bench.rs`.
#
# The one dev-dependency is `mandalactl`, the `--ipc` client, and it is
# here to be *read*, not run: `ipc/commands/mod.rs`'s tests hold its
# `verbs::VERBS` table against the registry `describe` renders, in both
# directions, so a command that lands without its client verb — or a
# verb whose command changed shape — fails the server's own PR. The
# edge points one way (app tests read the client's table); the client
# depends on nothing here, and a release build of the app compiles none
# of it.
[dev-dependencies]
mandalactl = { path = "crates/mandalactl" }
